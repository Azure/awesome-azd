name: "Submit an azd Template"
description: "Add your azd template to the Awesome azd gallery"
title: "[Template]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for submitting your azd template! Provide the repository URL and choose its primary use case.
        Other metadata is **auto-detected** from your repo — only fill it in if you want to override the detected values.

  - type: input
    id: source-repo
    attributes:
      label: "Source Repository"
      description: "GitHub repository URL for your template (we'll auto-detect the rest!)"
      placeholder: "https://github.com/org/repo"
    validations:
      required: true

  - type: dropdown
    id: primary-use-case
    attributes:
      label: "Primary Use Case"
      description: "Choose the best initial catalog classification. Maintainers can add more during review."
      options:
        - Build a web app
        - Build an API
        - Build an AI agent
        - Build an MCP server
        - Chat with documents
        - Query a database
        - Automate a workflow
        - Start with infrastructure
    validations:
      required: true

  - type: input
    id: template-title
    attributes:
      label: "Template Title (optional — auto-detected from repo)"
      description: "Override the auto-detected title"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: "Description (optional — auto-detected from repo)"
      description: "Override the auto-detected description"
    validations:
      required: false

  - type: input
    id: author
    attributes:
      label: "Author (optional — auto-detected from repo owner)"
      description: "Override the auto-detected author name"
    validations:
      required: false

  - type: input
    id: author-url
    attributes:
      label: "Author URL (optional — auto-detected from repo owner)"
      description: "Override the auto-detected author URL"
    validations:
      required: false

  - type: dropdown
    id: author-type
    attributes:
      label: "Author Type (optional — auto-detected)"
      description: "Override the auto-detected author type"
      options:
        - ""
        - Community
        - Microsoft
    validations:
      required: false

  - type: input
    id: application-screenshot
    attributes:
      label: "Application Screenshot URL (optional)"
      description: "URL to an image that shows the running application"
    validations:
      required: false

  - type: input
    id: architecture-diagram
    attributes:
      label: "Architecture Diagram URL (optional)"
      description: "URL to a diagram that shows the Azure services and their connections"
    validations:
      required: false

  - type: dropdown
    id: iac-provider
    attributes:
      label: "IaC Provider (optional — auto-detected from infra/ directory)"
      description: "Override the auto-detected IaC provider"
      options:
        - ""
        - Bicep
        - Terraform
        - Both
    validations:
      required: false

  - type: input
    id: languages
    attributes:
      label: "Languages (optional — auto-detected from repo)"
      description: "Comma-separated language tags (e.g., python, javascript)"
    validations:
      required: false

  - type: input
    id: frameworks
    attributes:
      label: "Frameworks (optional)"
      description: "Comma-separated framework tags (e.g., reactjs, fastapi)"
    validations:
      required: false

  - type: input
    id: azure-services
    attributes:
      label: "Azure Services (optional — auto-detected from repo topics)"
      description: "Comma-separated Azure service tags (e.g., aca, openai)"
    validations:
      required: false

  - type: textarea
    id: additional-info
    attributes:
      label: "Additional Information"
      description: "Any additional context about your template (optional)"
    validations:
      required: false
