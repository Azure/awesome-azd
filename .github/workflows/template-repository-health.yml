name: Template Repository Health

on:
  schedule:
    # Weekly on Monday at 07:00 UTC.
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: template-repository-health
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "24"

      - name: Audit template repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node .github/scripts/audit-template-repositories.js
          --catalog website/static/templates.json
          --repository "$GITHUB_REPOSITORY"
