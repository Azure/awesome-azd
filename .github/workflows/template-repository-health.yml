name: Template Repository Health

on:
  schedule:
    # Weekly on Monday at 07:00 UTC.
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: template-repository-health
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"

      - name: Audit template repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node .github/scripts/audit-template-repositories.js
          --catalog website/static/templates.json
          --repository "$GITHUB_REPOSITORY"
